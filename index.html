<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Personal homepage and contact information.">
    <meta name="theme-color" content="#f7f7f2">
    <title>Personal homepage</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23e5eddb'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%233f593b'/%3E%3C/svg%3E">
    <style>
      :root {
        color-scheme: light;
        --paper: #f7f7f2;
        --ink: #252b25;
        --muted: #6c746b;
        --accent: #3f593b;
        --line: #dce1d5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        background: var(--paper);
        color: var(--ink);
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      .frame {
        width: min(100% - 64px, 1120px);
        margin-inline: auto;
      }

      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-top: 40px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: .18em;
        text-transform: uppercase;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
      }

      main {
        display: flex;
        align-items: center;
        padding-block: 100px 120px;
      }

      .profile { width: 100%; }

      .greeting {
        margin: 0 0 22px;
        color: var(--accent);
        font-size: 14px;
        letter-spacing: .02em;
      }

      h1 {
        margin: 0;
        max-width: 100%;
        font-family: Georgia, "Times New Roman", "Noto Serif CJK SC", serif;
        font-size: clamp(58px, 9vw, 116px);
        font-weight: 400;
        letter-spacing: -.055em;
        line-height: 1.1;
        overflow-wrap: anywhere;
      }

      .contact {
        margin-top: 46px;
        padding-top: 25px;
        border-top: 1px solid var(--line);
        max-width: 410px;
      }

      .contact-label {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: .16em;
        text-transform: uppercase;
      }

      .email {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        min-height: 44px;
        max-width: 100%;
        color: var(--ink);
        font-size: 17px;
        line-height: 1.5;
        text-decoration: none;
        text-underline-offset: 5px;
      }

      .email span { overflow-wrap: anywhere; min-width: 0; }
      .email svg { width: 18px; height: 18px; flex-shrink: 0; }
      .email[href]:hover { color: var(--accent); text-decoration: underline; }
      .email:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 2px; }
      .email.placeholder { color: var(--muted); }
      [hidden] { display: none !important; }

      footer {
        padding-block: 20px 28px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 11px;
        letter-spacing: .02em;
      }

      noscript { display: block; padding: 24px 32px; color: var(--muted); }

      @media (max-width: 600px) {
        .frame { width: calc(100% - 48px); }
        header { padding-top: 28px; }
        main { padding-block: 90px; }
        .contact { margin-top: 36px; }
        .email { font-size: 16px; }
      }
    </style>
  </head>
  <body>
    <header class="frame"><span class="dot" aria-hidden="true"></span>Personal homepage</header>
    <main class="frame">
      <div class="profile">
        <p class="greeting">Hello, I'm</p>
        <h1 id="name">Xiang Li</h1>
        <div class="contact" id="contact">
          <p class="contact-label">Email</p>
          <a class="email placeholder" id="email"><span id="email-text">Email to be added</span><svg id="email-arrow" hidden aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 18 18 6M6 6h12v12"/></svg></a>
        </div>
      </div>
    </main>
    <footer class="frame">Personal homepage<span id="copyright"></span></footer>
    <noscript>Please enable JavaScript to view the latest contact information.</noscript>
    <script src="./profile.js"></script>
    <script>
      const profile = window.PROFILE || {};
      const name = typeof profile.name === "string" ? profile.name.trim() : "";
      const email = typeof profile.email === "string" ? profile.email.trim() : "";
      if (name) {
        document.querySelector("#name").textContent = name;
        document.title = `${name} | Personal homepage`;
        document.querySelector('meta[name="description"]').content = `${name}'s personal homepage and contact information.`;
        document.querySelector("#copyright").textContent = ` · ${name}`;
      }
      // 占位邮箱不生成链接，避免访客误发邮件。
      if (email && !email.toLowerCase().endsWith("@example.com") && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        document.querySelector("#email-text").textContent = email;
        const emailLink = document.querySelector("#email");
        emailLink.href = `mailto:${encodeURIComponent(email)}`;
        emailLink.classList.remove("placeholder");
        document.querySelector("#email-arrow").removeAttribute("hidden");
      }
    </script>
  </body>
</html>
